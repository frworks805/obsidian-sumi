name: Publish theme release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          cat > /tmp/sumi-release-notes.md <<'NOTES'
          - 編集画面で空行のカーソルが見えなくなる問題を修正しました。
          - 見出しバーの描画方法を変更し、表示のずれとカーソル移動への影響を修正しました。
          - 見出しの折りたたみ矢印の位置調整方法を変更しました。
          - ボタンと入力欄の枠線指定を見直し、プラグイン独自のデザインを上書きしにくくしました。
          NOTES
          gh release create "$VERSION" theme.css manifest.json --target "$GITHUB_SHA" --title "Sumi $VERSION" --notes-file /tmp/sumi-release-notes.md
